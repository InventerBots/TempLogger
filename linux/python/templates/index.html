<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Data Stream</title>
    <script>
        // Use Server-Sent Events to fetch the current_value from the /stream endpoint
        const eventSource = new EventSource('/stream');
        eventSource.onmessage = function(event) {
            document.getElementById('current-value').innerText = event.data;
        };
    </script>
</head>
<body>
    <h1>Arduino Data Stream</h1>
    <div>Temperature CH 1: <span id="temp_ch1">Loading...</span>&deg;F</div>
    <div>Temperature CH 2: <span id="temp_ch2">Loading...</span>&deg;F</div>
    <div>Temperature CH 3: <span id="temp_ch3">Loading...</span>&deg;F</div>
</body>
</html>
